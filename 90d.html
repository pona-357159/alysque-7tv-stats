                });
            }
            return combinedUsers.filter(u => u.count > 0 && u.username).sort((a, b) => b.count - a.count).slice(0, 10);
        }

        function escapeHtml(str) { return String(str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[m])); }

        function updateSummaryStats(emotes) {
            if (!Array.isArray(emotes)) emotes = [];
            const totalEmotes = emotes.length;
            const computedEmotes = emotes.filter(Boolean).map(e => ({ ...e, count: getComputedEmoteCount(e) }));
            const totalUses = computedEmotes.reduce((acc, e) => acc + e.count, 0);
            const mostUsed = computedEmotes.length ? [...computedEmotes].sort((a, b) => b.count - a.count)[0] : null;
            const avgUses = totalEmotes ? Math.round(totalUses / totalEmotes) : 0;
            const liveTotalUses = emotes.filter(Boolean).reduce((acc, e) => {
                const includeDuplicates = getIncludeDuplicates();
                const includeBots = getIncludeBots();
                let liveBase = includeDuplicates ? (e.liveCount || 0) : (e.uniqueLiveCount || 0);
                if (includeBots && Array.isArray(e.bots) && e.bots.length > 0) {
                    e.bots.forEach(b => {
                        liveBase += (b.totalLiveCount !== undefined ? b.totalLiveCount : (b.totalCount || b.count || 0));
                    });
                }
                return acc + liveBase;
            }, 0);
            const avgUsesPerHour = globalLiveHours > 0 ? (liveTotalUses / globalLiveHours).toFixed(1) : (liveTotalUses > 0 ? "N/A" : "0");

            document.getElementById("summaryTotalEmotes").textContent = totalEmotes.toLocaleString();
            document.getElementById("summaryTotalUses").textContent = totalUses.toLocaleString();
            document.getElementById("summaryTotalLiveHours").textContent = globalLiveHours ? globalLiveHours.toLocaleString() : "N/A";
            document.getElementById("summaryAvgUsesPerHour").textContent = avgUsesPerHour;
            document.getElementById("summaryTopEmote").textContent = mostUsed ? (mostUsed.name + " (" + mostUsed.count.toLocaleString() + ")") : "-";
            document.getElementById("summaryAvgUses").textContent = avgUses.toLocaleString();
        }

        window.handleImgLoad = function(img) {
            if (!img) return;
            const container = img.closest(".emote-img-skeleton") || img.parentElement;
            if (container) container.classList.remove("emote-img-skeleton");
        };

        window.handleImgError = function(img) {
            if (!img) return;
            const container = img.closest(".emote-img-skeleton") || img.parentElement;
            if (container) {
                container.classList.remove("emote-img-skeleton");
                container.innerHTML = "<span class=\"text-xs text-gray-600\">Failed</span>";
            }
        };

        function renderEmotes() {
            const query = searchInput && searchInput.value ? searchInput.value.toLowerCase().trim() : "";
            const sortMode = sortSelect ? sortSelect.value : "count-desc";

            let filtered = rawEmotesDataset.filter(Boolean).map(e => ({
                ...e,
                count: getComputedEmoteCount(e),
                computedTopUsers: getFilteredTopUsers(e)
            })).filter(e => e && e.name && e.name.toLowerCase().includes(query));

            filtered.sort((a, b) => {
                if (sortMode === "count-desc") return b.count - a.count;
                if (sortMode === "count-asc") return a.count - b.count;
                if (sortMode === "name-asc") return a.name.localeCompare(b.name);
                if (sortMode === "name-desc") return b.name.localeCompare(a.name);
                if (sortMode === "added-desc") return (b.addedTimestamp || 0) - (a.addedTimestamp || 0);
                if (sortMode === "added-asc") return (a.addedTimestamp || 0) - (b.addedTimestamp || 0);
                if (sortMode === "used-desc") return (b.lastUsedTimestamp || 0) - (a.lastUsedTimestamp || 0);
                if (sortMode === "used-asc") return (a.lastUsedTimestamp || 0) - (b.lastUsedTimestamp || 0);
                return 0;
            });

            updateSummaryStats(rawEmotesDataset);

            if (filtered.length === 0) {
                if (gridViewContainer) gridViewContainer.classList.add("hidden");
                if (tableViewContainer) tableViewContainer.classList.add("hidden");
                if (noResults) noResults.classList.remove("hidden");
                return;
            }

            if (noResults) noResults.classList.add("hidden");

            if (currentView === "grid") {
                if (gridViewContainer) gridViewContainer.classList.remove("hidden");
                if (tableViewContainer) tableViewContainer.classList.add("hidden");

                if (gridViewContainer) {
                    gridViewContainer.innerHTML = filtered.map(e => {
                        const topUsersHtml = e.computedTopUsers.length > 0 ? 
                            "<div class=\"top-users-popover text-left\">" +
                            "<div class=\"text-[10px] uppercase font-bold text-purple-400 border-b border-gray-700 pb-1 mb-1.5\">Top users</div>" +
                            "<div class=\"space-y-1\">" +
                            e.computedTopUsers.map((u, i) => 
                                "<div class=\"text-xs flex justify-between items-center text-gray-300\">" +
                                "<span class=\"truncate max-w-[140px] flex items-center gap-1.5\">" +
                                "<span class=\"text-gray-500 font-mono\">" + (i + 1) + ".</span>" +
                                "<span>" + escapeHtml(u.username) + "</span>" +
                                (u.isBot ? "<span class=\"text-[9px] bg-purple-600/20 text-purple-300 px-1.5 py-0.2 rounded font-sans\">bot</span>" : "") +
                                "</span>" +
                                "<span class=\"text-[10px] text-purple-300 font-mono\">" + u.count.toLocaleString() + "</span>" +
                                "</div>"
                            ).join("") +
                            "</div></div>" : "";

                        return (
                            "<div class=\"emote-card-wrapper\">" +
                            topUsersHtml +
                            "<div class=\"bg-darkcard border border-darkborder hover:border-purple-500 rounded-xl p-3 flex flex-col items-center text-center transition group\">" +
                            "<div class=\"h-16 w-full flex items-center justify-center mb-2 rounded-lg emote-img-skeleton overflow-hidden\">" +
                            (e.imgUrl ? "<img data-src=\"" + e.imgUrl + "\" alt=\"" + escapeHtml(e.name) + "\" loading=\"lazy\" decoding=\"async\" onload=\"handleImgLoad(this)\" onerror=\"handleImgError(this)\" class=\"max-h-14 max-w-full object-contain group-hover:scale-110 transition-transform\">" : "<span class=\"text-xs text-gray-600\">No Image</span>") +
                            "</div>" +
                            "<a href=\"" + e.pageUrl + "\" target=\"_blank\" class=\"font-semibold text-sm text-white hover:text-purple-400 truncate max-w-full\">" + escapeHtml(e.name) + "</a>" +
                            "<span class=\"text-xs text-purple-400 font-bold mt-0.5\">" + e.count.toLocaleString() + " uses</span>" +
                            "<div class=\"text-[10px] text-gray-400 mt-1 space-y-0.5\">" +
                            "<div>Added: " + e.addedFormatted + "</div>" +
                            "<div>Last Used: " + e.lastUsedFormatted + "</div>" +
                            "</div></div></div>"
                        );
                    }).join("");
                    enqueueImages(gridViewContainer.querySelectorAll("img[data-src]"));
                }
            } else {
                if (gridViewContainer) gridViewContainer.classList.add("hidden");
                if (tableViewContainer) tableViewContainer.classList.remove("hidden");

                if (tableBody) {
                    tableBody.innerHTML = filtered.map(e => {
                        const topUsersPopoverHtml = (e.computedTopUsers && e.computedTopUsers.length > 0) ? 
                            "<div class=\"top-users-popover text-left\">" +
                            "<div class=\"text-[10px] uppercase font-bold text-purple-400 border-b border-gray-700 pb-1 mb-1.5\">Top users</div>" +
                            "<div class=\"space-y-1\">" +
                            e.computedTopUsers.map((u, i) => 
                                "<div class=\"text-xs flex justify-between items-center text-gray-300\">" +
                                "<span class=\"truncate max-w-[140px] flex items-center gap-1.5\">" +
                                "<span class=\"text-gray-500 font-mono\">" + (i + 1) + ".</span>" +
                                "<span>" + escapeHtml(u.username) + "</span>" +
                                (u.isBot ? "<span class=\"text-[9px] bg-purple-600/20 text-purple-300 px-1.5 py-0.2 rounded font-sans\">bot</span>" : "") +
                                "</span>" +
                                "<span class=\"text-[10px] text-purple-300 font-mono\">" + u.count.toLocaleString() + "</span>" +
                                "</div>"
                            ).join("") +
                            "</div></div>" : "";

                        const topUsersSummary = e.computedTopUsers.map(u => u.username + (u.isBot ? " [bot]" : "") + " (" + u.count.toLocaleString() + ")").join(", ");

                        return (
                            "<tr class=\"hover:bg-darkbg/50 transition\">" +
                            "<td class=\"p-3\"><div class=\"table-popover-wrapper inline-block\">" +
                            (e.imgUrl ? "<img data-src=\"" + e.imgUrl + "\" alt=\"" + escapeHtml(e.name) + "\" loading=\"lazy\" decoding=\"async\" onload=\"handleImgLoad(this)\" onerror=\"handleImgError(this)\" class=\"w-8 h-8 object-contain cursor-pointer\">" : "-") +
                            "</div></td>" +
                            "<td class=\"p-3 font-semibold text-white truncate max-w-[160px]\">" + escapeHtml(e.name) + "</td>" +
                            "<td class=\"p-3 font-bold text-purple-400\">" + e.count.toLocaleString() + "</td>" +
                            "<td class=\"p-3 text-xs text-gray-400\">" + e.addedFormatted + "</td>" +
                            "<td class=\"p-3 text-xs text-gray-400\">" + e.lastUsedFormatted + "</td>" +
                            "<td class=\"p-3 text-xs text-gray-300 relative\">" +
                            (topUsersSummary ? 
                                "<div class=\"table-popover-wrapper relative inline-block w-full\">" +
                                topUsersPopoverHtml +
                                "<div class=\"truncate cursor-pointer text-purple-300 underline decoration-dashed decoration-gray-600 underline-offset-4 w-full\">" +
                                escapeHtml(topUsersSummary) +
                                "</div></div>" : "-") +
                            "</td>" +
                            "<td class=\"p-3\">" +
                            (e.pageUrl !== "#" ? "<a href=\"" + e.pageUrl + "\" target=\"_blank\" class=\"text-xs text-purple-400 hover:underline\">7TV Page</a>" : "-") +
                            "</td></tr>"
                        );
                    }).join("");
                    enqueueImages(tableViewContainer.querySelectorAll("img[data-src]"));
                }
            }
        }

        const chkIncludeOffline = document.getElementById("chkIncludeOffline");
        const chkIncludeBots = document.getElementById("chkIncludeBots");
        const chkIncludeDuplicates = document.getElementById("chkIncludeDuplicates");

        [chkIncludeOffline, chkIncludeBots, chkIncludeDuplicates].forEach(chk => { if (chk) chk.addEventListener("change", renderEmotes); });
        if (searchInput) searchInput.addEventListener("input", renderEmotes);
        if (sortSelect) sortSelect.addEventListener("change", renderEmotes);

        if (viewGridBtn) {
            viewGridBtn.addEventListener("click", () => {
                currentView = "grid";
                viewGridBtn.classList.replace("text-gray-400", "text-white");
                viewGridBtn.classList.add("bg-purple-600");
                if (viewTableBtn) { viewTableBtn.classList.replace("text-white", "text-gray-400"); viewTableBtn.classList.remove("bg-purple-600"); }
                renderEmotes();
            });
        }

        if (viewTableBtn) {
            viewTableBtn.addEventListener("click", () => {
                currentView = "table";
                viewTableBtn.classList.replace("text-gray-400", "text-white");
                viewTableBtn.classList.add("bg-purple-600");
                if (viewGridBtn) { viewGridBtn.classList.replace("text-white", "text-gray-400"); viewGridBtn.classList.remove("bg-purple-600"); }
        renderEmotes();
            });
        }

        document.addEventListener("DOMContentLoaded", () => { renderEmotes(); });
    </script>
</body>
</html>
